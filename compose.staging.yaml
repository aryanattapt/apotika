services:
  api:
    container_name: apt-stg-farmago-api
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${FARMAGO_DATABASE_URL:?set FARMAGO_DATABASE_URL}
      MFA_ENCRYPTION_KEY: ${FARMAGO_MFA_ENCRYPTION_KEY:?set FARMAGO_MFA_ENCRYPTION_KEY}
      API_PORT: "4000"
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      WEB_ORIGIN: https://farmago.aryanattapt.id
    command: ["sh", "-c", "bun apps/api/src/migrate.ts && exec bun apps/api/src/server.ts"]
    volumes:
      - farmago_uploads:/app/apps/api/storage
    networks:
      - apt-stg-internal
  web:
    container_name: apt-stg-farmago-web
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - apt-stg-internal
volumes:
  farmago_uploads:
networks:
  apt-stg-internal:
    external: true
    name: apt-stg-internal
